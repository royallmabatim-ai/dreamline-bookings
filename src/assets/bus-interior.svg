<svg width="1280" height="960" viewBox="0 0 1280 960" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="interiorGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Interior background -->
  <rect width="1280" height="960" fill="url(#interiorGradient)"/>
  
  <!-- Ceiling -->
  <rect width="1280" height="100" fill="#d9d9d9"/>
  
  <!-- Aisle -->
  <rect x="400" y="100" width="100" height="800" fill="#c0c0c0"/>
  
  <!-- Left side seats -->
  <g>
    <rect x="50" y="150" width="320" height="120" fill="#2c5f3f" rx="8"/>
    <ellipse cx="210" cy="210" rx="120" ry="50" fill="#3a7a4f" opacity="0.6"/>
    
    <rect x="50" y="300" width="320" height="120" fill="#2c5f3f" rx="8"/>
    <ellipse cx="210" cy="360" rx="120" ry="50" fill="#3a7a4f" opacity="0.6"/>
    
    <rect x="50" y="450" width="320" height="120" fill="#2c5f3f" rx="8"/>
    <ellipse cx="210" cy="510" rx="120" ry="50" fill="#3a7a4f" opacity="0.6"/>
    
    <rect x="50" y="600" width="320" height="120" fill="#2c5f3f" rx="8"/>
    <ellipse cx="210" cy="660" rx="120" ry="50" fill="#3a7a4f" opacity="0.6"/>
    
    <rect x="50" y="750" width="320" height="120" fill="#2c5f3f" rx="8"/>
    <ellipse cx="210" cy="810" rx="120" ry="50" fill="#3a7a4f" opacity="0.6"/>
  </g>
  
  <!-- Right side seats -->
  <g>
    <rect x="910" y="150" width="320" height="120" fill="#2c5f3f" rx="8"/>
    <ellipse cx="1070" cy="210" rx="120" ry="50" fill="#3a7a4f" opacity="0.6"/>
    
    <rect x="910" y="300" width="320" height="120" fill="#2c5f3f" rx="8"/>
    <ellipse cx="1070" cy="360" rx="120" ry="50" fill="#3a7a4f" opacity="0.6"/>
    
    <rect x="910" y="450" width="320" height="120" fill="#2c5f3f" rx="8"/>
    <ellipse cx="1070" cy="510" rx="120" ry="50" fill="#3a7a4f" opacity="0.6"/>
    
    <rect x="910" y="600" width="320" height="120" fill="#2c5f3f" rx="8"/>
    <ellipse cx="1070" cy="660" rx="120" ry="50" fill="#3a7a4f" opacity="0.6"/>
    
    <rect x="910" y="750" width="320" height="120" fill="#2c5f3f" rx="8"/>
    <ellipse cx="1070" cy="810" rx="120" ry="50" fill="#3a7a4f" opacity="0.6"/>
  </g>
  
  <!-- Windows -->
  <g opacity="0.3">
    <rect x="30" y="50" width="340" height="60" fill="#87ceeb" rx="4"/>
    <rect x="910" y="50" width="340" height="60" fill="#87ceeb" rx="4"/>
  </g>
  
  <!-- Label -->
  <text x="640" y="900" font-size="36" font-weight="bold" fill="#1a472a" text-anchor="middle">
    Comfortable Interior Seating
  </text>
</svg>